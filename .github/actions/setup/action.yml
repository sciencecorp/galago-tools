name: "Setup"
description: "Sets up dependencies and environment"

runs:
  using: "composite"
  steps:
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Use Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11.9
    - name: Install dependencies
      run: ./bin/make dev_deps && ./bin/make deps
      shell: bash
